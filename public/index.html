<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workspace App</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 2rem; line-height: 1.6; }
      .container { max-width: 800px; margin: 0 auto; }
      header { display: flex; align-items: center; justify-content: space-between; }
      h1 { margin: 0 0 0.5rem; font-size: 1.8rem; }
      .images { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-top: 1rem; }
      .card { border: 1px solid #8883; border-radius: 10px; padding: 12px; }
      img { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; }
      code { background: #8882; padding: 2px 6px; border-radius: 6px; }
      footer { opacity: 0.7; margin-top: 2rem; font-size: 0.9rem; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Welcome 👋</h1>
        <nav>
          <a href="/api/health">API Health</a>
        </nav>
      </header>
      <p>
        This is a minimal Node + Express app serving static files from <code>public/</code> and images from <code>images/</code>.
      </p>
      <section>
        <h2>Available Images</h2>
        <div id="images" class="images"></div>
      </section>
      <footer>
        Edit this page at <code>public/index.html</code>. Server at <code>server.js</code>.
      </footer>
    </div>
    <script>
      async function loadImages() {
        const res = await fetch('/api/images');
        const data = await res.json();
        const container = document.getElementById('images');
        if (!data.images || data.images.length === 0) {
          container.innerHTML = '<p class="card">No images found in <code>images/</code>.</p>';
          return;
        }
        container.innerHTML = data.images.map((src) => `
          <div class="card">
            <img src="${src}" alt="image" />
            <div style="margin-top:8px"><code>${src}</code></div>
          </div>
        `).join('');
      }
      loadImages();
    </script>
  </body>
</html>
